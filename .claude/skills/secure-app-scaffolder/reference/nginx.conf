# Included in the `http` context (e.g. /etc/nginx/conf.d/default.conf of nginx-unprivileged).
# X25519MLKEM768 requires nginx linked against OpenSSL >= 3.5; with an older OpenSSL
# nginx refuses to start, so check `nginx -V` of the chosen image.

server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /run/secrets/tls/tls.crt;
    ssl_certificate_key /run/secrets/tls/tls.key;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519MLKEM768:X25519:prime256v1;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size  10m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    keepalive_timeout     30s;

    # add_header in a location block drops these headers: never use add_header inside locations.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
    }

    location ~ \.map$ {
        return 404;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/proxy_backend.conf;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/proxy_backend.conf;
    }

    location /api/v1/llm/stream {
        limit_req zone=api burst=5 nodelay;
        proxy_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_backend.conf;
    }

    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_buffering off;
        include /etc/nginx/proxy_backend.conf;
    }
}

